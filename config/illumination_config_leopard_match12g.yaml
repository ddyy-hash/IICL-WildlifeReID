# Leopard match-aware 12GB local tuning config.

illumination_module:
  module_type: "IPAIDModule"
  loss_params:
    lambda_recon: 1.0
    lambda_smooth: 0.12
    lambda_edge: 0.08
    lambda_structure: 0.12
    lambda_sensitivity: 0.02
    lambda_identity: 0.28
    lambda_lab_chroma: 0.04
    lambda_high_freq: 0.05
    lambda_log_chroma: 0.05
    chroma_mode: "dual"
  module_params:
    base_channels: 32
    num_scales: 3
    refine_iterations: 1
    use_sensitivity: true
    use_refinement: true
    use_feature_guided: true
    use_color_illumination: true
    color_illumination_mode: "global_white_balance"
    species_type: "spotted"
    backbone_mid_channels: 384
    safe_color_enabled: true
    max_color_shift: 0.07
    safe_gain_min: 0.55
    safe_gain_max: 1.75
    color_risk_scale: 3.0
    max_color_risk: 0.55
    clamp_input_range: true
    wb_max_shift: 0.10
    enable_task_aware_rollback: true
    rollback_hidden_dim: 64
    rollback_min_alpha: 0.08
    rollback_max_alpha: 0.97
    rollback_granularity: "stripe"
    rollback_num_stripes: 6
    use_model_aware_residual: true
    model_residual_hidden_dim: 64
    model_residual_scale: 0.14
    enable_coarse_task_grad: true
    coarse_guidance_mode: "safe"
    num_grad_variants: 0

model:
  backbone: "osnet_ain_x1_0"
  local_extractor:
    num_parts: 6
    dropout: 0.18
  feature_fusion:
    enabled: true
    hidden_dim: 128
    init_corrected_bias: 1.30
    include_illum_stats: true
    max_residual_scale: 0.35
  branch_attention_fusion:
    enabled: true
    hidden_dim: 128
    num_branches: 3
    temperature: 1.0
    include_illum_stats: true
  nuisance_head:
    enabled: true
    hidden_dim: 128
    nuisance_dim: 64
    photometric_dim: 4
  illumination_module:
    enabled: true

training:
  data_dir: "data/processed/leopard/train"
  query_dir: "data/processed/leopard/query"
  gallery_dir: "data/processed/leopard/gallery"
  output_dir: "checkpoints/tmm_leopard_match12g"
  num_classes: 291
  image_height: 256
  image_width: 256
  image_size: 256
  batch_size: 18
  learning_rate: 0.00028
  weight_decay: 0.015
  gradient_clip: 1.0
  eval_interval: 4
  pk_sampler:
    enabled: true
    p: 6
    k: 3
  center_loss:
    enabled: true
    weight: 0.0006
    feat_dim: 256
    lr_scale: 0.5
  metric_learning:
    ce_loss:
      enabled: true
      label_smoothing: 0.16
      weight: 1.0
    arcface_loss:
      enabled: true
      weight: 0.50
      s: 30.0
      m: 0.28
    triplet_loss:
      enabled: true
      margin: 0.28
      mining_type: "soft"
      weight: 0.90
    circle_loss:
      enabled: false
      margin: 0.25
      gamma: 256
      weight: 0.0
  iicl:
    enabled: true
    weight: 0.12
    temperature: 0.07
    loss_type: "cosine"
    num_variants: 2
    num_grad_variants: 0
    variant_type: "data_driven"
    mix_ratio: 0.7
  photo_prior:
    initial_weight: 0.45
    min_weight: 0.05
    decay_power: 1.5
  cross_light_prototype:
    enabled: false
    weight: 0.12
  cross_light_margin_preserving:
    enabled: false
    weight: 0.12
  cross_light_softap:
    enabled: true
    weight: 0.12
    similarity: "cosine"
    photometric_scale: 8.0
    photometric_offset: 0.10
    min_positive_weight: 0.05
    rank_temperature: 0.07
    queue_size: 128
  teacher_manifold:
    enabled: true
    tube_weight: 0.26
    separation_weight: 0.08
    similarity: "cosine"
    photometric_scale: 8.0
    photometric_offset: 0.10
    min_positive_weight: 0.05
    shrinkage: 0.80
    orthogonal_weight: 1.00
    subspace_rank: 1
    min_radius: 0.02
    margin: 0.08
    queue_size: 128
  ranking_topology:
    enabled: false
    weight: 0.0
  anisotropic_identity_protection:
    enabled: false
    weight: 0.0
  semantic_non_confusion:
    enabled: false
    weight: 0.0
  nuisance_decoupling:
    enabled: true
    weight: 0.04
    regression_weight: 0.0
    decorrelation_weight: 0.5
  teacher_prototype_anchor:
    enabled: false
    weight: 0.0
  relative_class_structure:
    enabled: false
    weight: 0.0
  feature_trust_region:
    enabled: false
    weight: 0.0
  local_rank_preserving:
    enabled: false
    weight: 0.0
  identity_image_preserving:
    enabled: true
    weight: 0.02
  aux_gradient_gate:
    enabled: true
    eps: 1.0e-8
  identity_preserving:
    mode: "softap"
    phase2_scale: 0.0
    phase3_scale: 1.00
    anchor_weight: 0.35
    geometry_weight: 12.0
    logit_weight: 0.03
    detach_reference: true
    teacher_temperature: 2.0
    similarity: "cosine"
    geometry_loss: "mse"
  phases:
    phase1:
      name: "backbone_warmup"
      epochs: 8
      freeze_backbone: false
      freeze_illumination: true
      illumination_weight: 0.0
      reid_weight: 1.0
      backbone_lr: 0.00028
    phase2:
      name: "fgid_warmup"
      epochs: 0
      freeze_backbone: true
      freeze_illumination: false
      illumination_weight: 1.0
      reid_weight: 0.0
      illumination_lr: 0.00010
    phase3:
      name: "joint_training"
      epochs: 32
      batch_size: 18
      use_backbone_checkpointing: true
      freeze_backbone: false
      freeze_illumination: false
      illumination_weight: 0.32
      reid_weight: 1.0
      illumination_lr: 0.00005
      backbone_lr: 0.00014
      aux_ramp:
        enabled: true
        epochs: 4
        illumination_start: 0.05
        illumination_end: 0.32
        iicl_start: 0.00
        iicl_end: 0.12
        cross_light_start: 0.00
        cross_light_end: 0.12

data_augmentation:
  random_horizontal_flip: 0.5
  random_crop:
    enabled: true
    scale: [0.84, 1.0]
    ratio: [0.85, 1.18]
  random_erasing:
    enabled: true
    probability: 0.45
    scale: [0.02, 0.20]
    ratio: [0.3, 3.0]
  color_jitter:
    brightness: 0.18
    contrast: 0.16
    saturation: 0.12
    hue: 0.03
  random_grayscale:
    enabled: true
    probability: 0.05
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

evaluation:
  eval_interval: 4
  protocol: "self_defined_train_qg"
  selection_query_dir: "data/processed/leopard/selection_query"
  selection_gallery_dir: "data/processed/leopard/selection_gallery"
  selection_info: "data/processed/leopard/split_info.json"
  query_dir: "data/processed/leopard/query"
  gallery_dir: "data/processed/leopard/gallery"
  best_metric: "mAP"
  strict_protocol_check: true
  additional_protocols: []
  reranking:
    enabled: false
    k1: 20
    k2: 6
    lambda_value: 0.3
  feature_extraction:
    flip_test: true
    normalize: true
    exclude_same_camera: false

checkpointing:
  save_interval: 10
  max_keep: 3

logging:
  log_interval: 20
  tensorboard: true
  wandb:
    enabled: false
    project: "tmm-leopard-match12g"

hardware:
  device: "cuda"
  num_workers: 2
  use_amp: true
  amp_dtype: "bfloat16"
  use_backbone_checkpointing: true
  use_ddp: false
  pin_memory: true
  prefetch_factor: 2

paper_protocol:
  source_dataset_protocol: "match_aware_identity_disjoint_query_gallery"
  training_selection_protocol: "self_defined_train_qg"
  final_report_protocol: "query_gallery"
  selection_metric: "mAP"

output_dir: "checkpoints/tmm_leopard_match12g"
