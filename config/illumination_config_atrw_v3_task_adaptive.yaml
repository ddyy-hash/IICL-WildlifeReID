# Experimental ATRW v3 config.
# Keeps the v2 training recipe, but turns illumination into a more task-adaptive branch.

illumination_module:
  module_type: "IPAIDModule"
  loss_params:
    lambda_recon: 1.0
    lambda_smooth: 0.15
    lambda_edge: 0.08
    lambda_sensitivity: 0.02
    lambda_identity: 0.1
    lambda_lab_chroma: 0.04
    lambda_high_freq: 0.03
    lambda_log_chroma: 0.08
  module_params:
    base_channels: 32
    num_scales: 3
    refine_iterations: 2
    use_sensitivity: true
    use_refinement: true
    use_feature_guided: true
    use_color_illumination: true
    color_illumination_mode: global_white_balance
    backbone_mid_channels: 384
    safe_color_enabled: true
    max_color_shift: 0.08
    safe_gain_min: 0.5
    safe_gain_max: 1.6
    color_risk_scale: 3.0
    max_color_risk: 0.55
    clamp_input_range: true
    wb_max_shift: 0.10

training:
  batch_size: 20
  image_height: 256
  image_width: 256
  image_size: 256
  weight_decay: 0.01
  gradient_clip: 1.0
  eval_interval: 5
  pk_sampler:
    enabled: true
    p: 4
    k: 5
  center_loss:
    enabled: true
    weight: 0.0005
    feat_dim: 256
    lr_scale: 0.5
  metric_learning:
    ce_loss:
      enabled: true
      label_smoothing: 0.2
      weight: 1.0
    arcface_loss:
      enabled: true
      weight: 0.5
      s: 30.0
      m: 0.25
    triplet_loss:
      enabled: true
      margin: 0.3
      mining_type: "soft"
      weight: 1.0
    circle_loss:
      enabled: false
      margin: 0.25
      gamma: 256
      weight: 0.0
  iicl:
    enabled: true
    weight: 1.0
    temperature: 0.07
    loss_type: "mse"
    num_variants: 2
    variant_type: "data_driven"
    mix_ratio: 0.7
  phases:
    phase1:
      name: "backbone_warmup"
      epochs: 15
      freeze_backbone: false
      freeze_illumination: true
      illumination_weight: 0.0
      reid_weight: 1.0
      backbone_lr: 0.00035
    phase2:
      name: "fgid_warmup"
      epochs: 15
      freeze_backbone: true
      freeze_illumination: false
      illumination_weight: 1.0
      reid_weight: 0.0
      lr: 0.0001
    phase3:
      name: "joint_training"
      epochs: 100
      freeze_backbone: false
      freeze_illumination: false
      illumination_weight: 0.2
      reid_weight: 1.0
      illumination_lr: 0.00005
      backbone_lr: 0.000175

model:
  backbone: "osnet_ain_x1_0"
  local_extractor:
    num_parts: 6
    dropout: 0.0
  feature_fusion:
    enabled: true
    hidden_dim: 128
    init_corrected_bias: 2.0
  illumination_module:
    enabled: true

data_augmentation:
  random_horizontal_flip: 0.5
  random_rotation: 15
  random_crop:
    enabled: true
    scale: [0.85, 1.0]
    ratio: [0.9, 1.1]
  random_erasing:
    enabled: true
    probability: 0.5
    scale: [0.02, 0.2]
    ratio: [0.3, 3.3]
  color_jitter:
    brightness: 0.1
    contrast: 0.1
    saturation: 0.1
    hue: 0.02
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

evaluation:
  eval_interval: 5
  protocol: "val_split_70_30"
  best_metric: "rank1"
  strict_protocol_check: true
  atrw:
    data_root: "orignal_data/Amur Tiger Re-identification"
    test_dir: null
    eval_script_dir: "ATRWEvalScript-main"
    batch_size: 64
    num_workers: 4
    train_ratio: 0.7
    seed: 42
  feature_extraction:
    flip_test: true
    normalize: true
    exclude_same_camera: false

checkpointing:
  save_interval: 10
  max_keep: 5

hardware:
  num_workers: 4

output_dir: "./checkpoints/atrw_v3_task_adaptive"
