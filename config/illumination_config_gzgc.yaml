# =============================================================================
# =============================================================================
#   - 1113 query, 1352 gallery
#
# =============================================================================

# =============================================================================
# =============================================================================
illumination_module:
  module_type: "IPAIDModule"
  
  loss_params:
    lambda_recon: 1.0
    lambda_smooth: 0.1
    lambda_edge: 0.1
    lambda_sensitivity: 0.02
    lambda_identity: 0.1
    
  module_params:
    base_channels: 48
    num_scales: 4
    refine_iterations: 3
    use_sensitivity: true
    use_refinement: true

# =============================================================================
# =============================================================================
model:
  backbone: "osnet_ain_x1_0"
  pretrained: true
  feature_dim: 512
  
  illumination_module:
    enabled: true
    method: "ipaid"
  
  local_extractor:
    enabled: true
    num_parts: 6
    attention_type: "se"
    pooling: "gem"
    dropout: 0.4

# =============================================================================
# =============================================================================
training:
  data_dir: "data/processed/gzgc_zebra/train"
  query_dir: "data/processed/gzgc_zebra/query"
  gallery_dir: "data/processed/gzgc_zebra/gallery"
  output_dir: "checkpoints/joint_gzgc_zebra_v2"
  
  num_classes: 1033
  batch_size: 64
  image_height: 256
  image_width: 256
  num_workers: 4
  
  learning_rate: 0.00035
  weight_decay: 0.001
  
  pk_sampler:
    enabled: true
    p: 16
    k: 2

  center_loss:
    enabled: true
    weight: 0.0005
    feat_dim: 256
    lr_scale: 0.5
  
  phases:
    phase1:
      name: "backbone_warmup"
      epochs: 50
      freeze_backbone: false
      freeze_illumination: true
      illumination_weight: 0.0
      reid_weight: 1.0
      lr_scheduler: "warmup_cosine"
      warmup_epochs: 3
      
    phase2:
      name: "joint_training"
      epochs: 150
      freeze_backbone: false
      freeze_illumination: false
      illumination_weight: 0.3
      reid_weight: 1.0
      lr_scheduler: "cosine"
      min_lr: 0.000001
  
  losses:
    cross_entropy:
      enabled: true
      weight: 1.0
      label_smoothing: 0.1
      
    triplet:
      enabled: false
      weight: 0.0
      margin: 0.3
      mining: "hard"
      
    arcface:
      enabled: true
      weight: 1.0
      s: 30.0
      m: 0.35
      
    iicl:
      enabled: true
      weight: 1.0
      temperature: 0.07
      use_hard_mining: true

  augmentation:
    random_flip: true
    random_crop: true
    padding: 10
    random_erasing:
      enabled: true
      probability: 0.5
      scale: [0.02, 0.33]
      ratio: [0.3, 3.3]
    color_jitter:
      enabled: true
      brightness: 0.2
      contrast: 0.2
      saturation: 0.1
      hue: 0.05
    random_grayscale: 0.1

# =============================================================================
# =============================================================================
evaluation:
  eval_freq: 10
  metrics: ["rank1", "rank5", "rank10", "mAP"]
  reranking:
    enabled: false
    k1: 20
    k2: 6
    lambda_value: 0.3

# =============================================================================
# =============================================================================
logging:
  log_freq: 20
  tensorboard: true
  save_freq: 20
  keep_last_n: 5

# =============================================================================
# =============================================================================
environment:
  device: "cuda"
  seed: 42
  deterministic: true
  mixed_precision: true
