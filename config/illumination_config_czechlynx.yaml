
# =============================================================================
# =============================================================================
illumination_module:
  module_type: "IPAIDModule"
  
  loss_params:
    lambda_recon: 1.0
    lambda_smooth: 0.15
    lambda_edge: 0.08
    lambda_sensitivity: 0.02
    lambda_identity: 0.1
    
  module_params:
    base_channels: 32
    num_scales: 3
    refine_iterations: 2
    use_sensitivity: true
    use_refinement: true

# =============================================================================
# =============================================================================
training:
  batch_size: 32
  image_height: 256
  image_width: 256
  image_size: 256
  num_workers: 4
  
  learning_rate: 0.00035
  weight_decay: 0.01
  
  pk_sampler:
    enabled: true
    p: 16
    k: 4

  # Center Loss
  center_loss:
    enabled: true
    weight: 0.0005
    feat_dim: 256
    lr_scale: 0.5
  
  phases:
    phase1:
      name: "backbone_warmup"
      epochs: 10
      freeze_backbone: false
      freeze_illumination: true
      illumination_weight: 0.0
      reid_weight: 1.0
      illumination_lr: 0.0001
      warmup_epochs: 0
      
    phase2:
      name: "joint_finetuning"
      epochs: 100
      freeze_backbone: false
      illumination_weight: 0.3
      reid_weight: 1.0
      illumination_lr: 0.00005
      backbone_lr: 0.00035
      warmup_epochs: 0
  
  scheduler:
    type: "CosineAnnealingWarmRestarts"
    T_0: 50
    T_mult: 2
    eta_min: 0.000001
  
  gradient_clip: 1.0
  
  early_stopping:
    enabled: true
    patience: 30
    monitor: "mAP"
    min_delta: 0.001
  
  metric_learning:
    ce_loss:
      enabled: true
      label_smoothing: 0.1
      weight: 1.0
    
    arcface_loss:
      enabled: true
      weight: 0.5
      s: 30.0
      m: 0.25
    
    triplet_loss:
      enabled: true
      margin: 0.3
      mining_type: "soft"
      weight: 1.0
    
    circle_loss:
      enabled: false
      weight: 0.0
      margin: 0.25
      gamma: 256
    
    center_loss:
      enabled: true
      weight: 0.0005

  iicl:
    enabled: true
    weight: 1.0
    temperature: 0.07
    variants: 2
    memory_size: 2048
    momentum: 0.9

# =============================================================================
# =============================================================================
data_augmentation:
  random_horizontal_flip: 0.5
  random_rotation: 15
  random_crop:
    enabled: true
    scale: [0.85, 1.0]
    ratio: [0.9, 1.1]
  random_erasing:
    enabled: true
    probability: 0.5
    scale: [0.02, 0.2]
    ratio: [0.3, 3.3]
  
  color_jitter:
    brightness: 0.3
    contrast: 0.3             # ↑
    saturation: 0.2           # ↑
    hue: 0.05                 # ↑
  
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# =============================================================================
# =============================================================================
evaluation:
  eval_interval: 5
  reranking:
    enabled: false
    k1: 20
    k2: 6
    lambda_value: 0.3
  
  feature_extraction:
    flip_test: true
    normalize: true

# =============================================================================
# =============================================================================
output:
  checkpoint_dir: "checkpoints/joint_czechlynx"
  log_dir: "checkpoints/joint_czechlynx"

# =============================================================================
# =============================================================================
checkpointing:
  save_interval: 10
  save_best_only: false
  max_keep: 5

# =============================================================================
# =============================================================================
logging:
  log_interval: 20
  tensorboard: true
  wandb:
    enabled: false
    project: "czechlynx-reid-ipaid"
    entity: null

# =============================================================================
# =============================================================================
model:
  backbone: "osnet_ain_x1_0"

# =============================================================================
# =============================================================================
yolo:
  model_path: "fea_data/yolov8m-seg.pt"
  conf_threshold: 0.3
  iou_threshold: 0.5
  use_soft_mask: true

# =============================================================================
# =============================================================================
hardware:
  device: "cuda"
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
