illumination_module:
  module_type: IPAIDModule
  loss_params:
    lambda_recon: 1.0
    lambda_smooth: 0.12
    lambda_edge: 0.08
    lambda_structure: 0.12
    lambda_sensitivity: 0.02
    lambda_identity: 0.3
    lambda_lab_chroma: 0.03
    lambda_high_freq: 0.04
    lambda_log_chroma: 0.06
    chroma_mode: dual
  module_params:
    base_channels: 32
    num_scales: 3
    refine_iterations: 1
    use_sensitivity: true
    use_refinement: true
    use_feature_guided: true
    use_color_illumination: true
    color_illumination_mode: global_white_balance
    species_type: stripe
    backbone_mid_channels: 384
    safe_color_enabled: true
    max_color_shift: 0.06
    safe_gain_min: 0.55
    safe_gain_max: 1.75
    color_risk_scale: 3.0
    max_color_risk: 0.5
    clamp_input_range: true
    wb_max_shift: 0.1
    enable_task_aware_rollback: true
    rollback_hidden_dim: 64
    rollback_min_alpha: 0.08
    rollback_max_alpha: 0.97
    rollback_granularity: stripe
    rollback_num_stripes: 6
    use_model_aware_residual: true
    model_residual_hidden_dim: 64
    model_residual_scale: 0.15
    enable_coarse_task_grad: true
    coarse_guidance_mode: safe
    num_grad_variants: 2
model:
  backbone: osnet_ain_x1_0
  local_extractor:
    num_parts: 6
    dropout: 0.1
  feature_fusion:
    enabled: true
    hidden_dim: 128
    init_corrected_bias: 1.5
    include_illum_stats: true
    max_residual_scale: 0.35
  branch_attention_fusion:
    enabled: true
    hidden_dim: 128
    num_branches: 3
    temperature: 1.0
    include_illum_stats: true
  nuisance_head:
    enabled: true
    hidden_dim: 128
    nuisance_dim: 64
    photometric_dim: 4
  illumination_module:
    enabled: true
training:
  image_height: 256
  image_width: 384
  image_size: 256
  batch_size: 32
  weight_decay: 0.01
  gradient_clip: 1.0
  eval_interval: 2
  learning_rate: 0.00035
  pk_sampler:
    enabled: true
    p: 8
    k: 4
  center_loss:
    enabled: true
    weight: 0.0005
    feat_dim: 256
    lr_scale: 0.5
  metric_learning:
    ce_loss:
      enabled: true
      label_smoothing: 0.1
      weight: 1.0
    arcface_loss:
      enabled: true
      weight: 0.5
      s: 30.0
      m: 0.3
    triplet_loss:
      enabled: true
      margin: 0.3
      mining_type: soft
      weight: 1.0
    circle_loss:
      enabled: false
      margin: 0.25
      gamma: 256
      weight: 0.0
  iicl:
    enabled: true
    weight: 0.1
    temperature: 0.07
    loss_type: cosine
    num_variants: 2
    num_grad_variants: 0
    variant_type: data_driven
    mix_ratio: 0.7
  photo_prior:
    initial_weight: 0.45
    min_weight: 0.05
    decay_power: 1.5
  cross_light_prototype:
    enabled: false
    weight: 0.12
    similarity: cosine
    photometric_scale: 8.0
    photometric_offset: 0.1
    min_gap_weight: 0.1
  cross_light_margin_preserving:
    enabled: false
    weight: 0.12
    similarity: cosine
    photometric_scale: 8.0
    photometric_offset: 0.1
    topk_positive: 2
    topk_negative: 4
    margin_delta: 0.02
    beta: 12.0
  cross_light_softap:
    enabled: true
    weight: 0.12
    similarity: cosine
    photometric_scale: 8.0
    photometric_offset: 0.1
    min_positive_weight: 0.05
    rank_temperature: 0.07
    queue_size: 192
  teacher_manifold:
    enabled: true
    tube_weight: 0.3
    separation_weight: 0.1
    similarity: cosine
    photometric_scale: 8.0
    photometric_offset: 0.1
    min_positive_weight: 0.05
    shrinkage: 0.8
    orthogonal_weight: 1.0
    subspace_rank: 1
    min_radius: 0.02
    margin: 0.08
    queue_size: 192
  ranking_topology:
    enabled: false
    weight: 0.18
    similarity: cosine
    photometric_scale: 8.0
    photometric_offset: 0.1
    min_positive_weight: 0.05
    topk_positive: 2
    topk_negative: 4
    margin_slack: 0.01
    beta: 12.0
    queue_size: 192
  anisotropic_identity_protection:
    enabled: false
    weight: 0.1
    similarity: cosine
    photometric_scale: 8.0
    photometric_offset: 0.1
    min_positive_weight: 0.05
    topk_positive: 2
    topk_negative: 4
    subspace_rank: 1
    identity_weight: 1.0
    nuisance_weight: 0.5
    nuisance_radius: 0.12
  semantic_non_confusion:
    enabled: false
    weight: 0.0
    margin_delta: 0.02
    squared: true
  nuisance_decoupling:
    enabled: true
    weight: 0.04
    regression_weight: 0.0
    decorrelation_weight: 0.5
  teacher_prototype_anchor:
    enabled: false
    weight: 0.0
    metric: cosine
  relative_class_structure:
    enabled: false
    weight: 0.0
    metric: mse
    radial_weight: 0.5
  feature_trust_region:
    enabled: false
    weight: 0.0
    base_radius: 0.1
    adaptive_scale: 0.5
    class_spread_scale: 1.0
  local_rank_preserving:
    enabled: false
    weight: 0.0
    alpha: 0.9
    k_positive: 2
    k_negative: 4
  neighborhood_consistency:
    enabled: true
    weight: 0.07
    temperature: 0.07
    topk: 6
    positive_weight: 1.0
    negative_weight: 0.22
    local_weight: 0.4
    use_global: true
    use_local: true
    use_hard_negatives: true
    teacher_target: soft
  identity_image_preserving:
    enabled: true
    weight: 0.02
  aux_gradient_gate:
    enabled: true
    eps: 1.0e-08
  identity_preserving:
    mode: softap
    phase2_scale: 0.0
    phase3_scale: 1.0
    anchor_weight: 0.35
    geometry_weight: 12.0
    logit_weight: 0.03
    detach_reference: true
    teacher_temperature: 2.0
    similarity: cosine
    geometry_loss: mse
  phases:
    phase1:
      name: backbone_warmup
      epochs: 15
      freeze_backbone: false
      freeze_illumination: true
      illumination_weight: 0.0
      reid_weight: 1.0
      backbone_lr: 0.00035
    phase2:
      name: fgid_warmup
      epochs: 0
      freeze_backbone: true
      freeze_illumination: false
      illumination_weight: 1.0
      reid_weight: 0.0
      illumination_lr: 0.0001
    phase3:
      name: joint_training
      epochs: 66
      batch_size: 32
      use_backbone_checkpointing: true
      freeze_backbone: false
      freeze_illumination: false
      illumination_weight: 0.35
      reid_weight: 1.0
      illumination_lr: 5.0e-05
      backbone_lr: 0.000175
      aux_ramp:
        enabled: true
        epochs: 6
        illumination_start: 0.05
        illumination_end: 0.35
        iicl_start: 0.0
        iicl_end: 0.1
        cross_light_start: 0.0
        cross_light_end: 0.12
  output_dir: checkpoints/tmm_glncd_20260513/atrw/glncd_full
  data_dir: data/processed/atrw/train
data_augmentation:
  random_horizontal_flip: 0.5
  random_crop:
    enabled: true
    scale:
    - 0.88
    - 1.0
  random_erasing:
    enabled: true
    probability: 0.4
    scale:
    - 0.02
    - 0.15
    ratio:
    - 0.3
    - 3.0
  color_jitter:
    brightness: 0.06
    contrast: 0.08
    saturation: 0.05
    hue: 0.01
  normalize:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
evaluation:
  eval_interval: 2
  protocol: atrw_openset
  additional_protocols:
  - atrw_closedset_train70_val30
  best_metric: mmAP
  strict_protocol_check: true
  reranking:
    enabled: false
    k1: 25
    k2: 6
    lambda_value: 0.2
  atrw:
    data_root: orignal_data/Amur Tiger Re-identification
    test_dir: null
    eval_script_dir: ATRWEvalScript-main
    batch_size: 64
    num_workers: 4
    train_ratio: 0.7
    seed: 42
  feature_extraction:
    flip_test: true
    normalize: true
    exclude_same_camera: false
checkpointing:
  save_interval: 5
  max_keep: 6
  save_best_only: false
hardware:
  num_workers: 4
  use_backbone_checkpointing: false
  use_ddp: false
  ddp_backend: nccl
  ddp_find_unused_parameters: false
  ddp_timeout_minutes: 30
  use_amp: true
  amp_dtype: bfloat16
output_dir: checkpoints/tmm_glncd_20260513/atrw/glncd_full
output:
  checkpoint_dir: checkpoints/tmm_glncd_20260513/atrw/glncd_full
  log_dir: checkpoints/tmm_glncd_20260513/atrw/glncd_full
tmm_glncd_20260513:
  dataset: atrw
  variant: glncd_full
  priority: core
  rationale: core ATRW validation of GL-NCD
  algorithm_change: GL-NCD train-time global-local neighborhood consistency
  baseline_config: config/illumination_config_atrw.yaml
  selection_protocol: atrw_openset
  best_metric: mmAP
